<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Truck Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0d0d1a; --card: #151525; --accent: #2a5298; --accent-light: #4a7fd4; --text: #e8eaf0; --border: #252538; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'DM Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; margin-bottom: 24px; }
    h2 { margin-bottom: 16px; color: var(--accent-light); }
    .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8a8aa0; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #080810; color: #fff; outline: none; }
    button { padding: 10px 16px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    button:hover { background: var(--accent-light); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 13px; }
    th { background: #080810; }
    .danger-btn { background: #dc2626; padding: 6px 10px; font-size: 11px; }
    .danger-btn:hover { background: #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2>Admin Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@alturas.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" />
    </div>
    <button onclick="handleLogin()">Sign In</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="dashboardSection" style="display:none;">
    <div style="display:flex; justify-style:space-between; align-items:center; margin-bottom:20px;">
      <h1>Admin Dashboard</h1>
      <button onclick="handleLogout()" style="background:#444;">Logout</button>
    </div>

    <!-- ADD BOOKING FORM -->
    <div class="card">
      <h2>Add Food Truck Visit</h2>
      <div class="form-group">
        <label>Food Truck Name</label>
        <input type="text" id="truckName" placeholder="e.g. Tacos El Rey" />
      </div>
      <div class="form-group">
        <label>Property Location</label>
        <select id="propertyName">
          <option value="Northcreek">Northcreek</option>
          <option value="985 Space Center">985 Space Center</option>
          <option value="1055 Newport">1055 Newport</option>
          <option value="Garden Gateway">Garden Gateway</option>
          <option value="Presidio">Presidio</option>
        </select>
      </div>
      <div class="form-group">
        <label>Visit Date</label>
        <input type="date" id="visitDate" />
      </div>
      <div class="form-group">
        <label>Time Slot</label>
        <input type="text" id="timeSlot" placeholder="11:00 AM - 2:00 PM" />
      </div>
      <div class="form-group">
        <label>Menu File (PDF or Image)</label>
        <input type="file" id="menuFile" accept="image/*,application/pdf" />
      </div>
      <button onclick="createBooking()">Save Visit</button>
    </div>

    <!-- EXISTING BOOKINGS TABLE -->
    <div class="card">
      <h2>Current Bookings</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Truck</th>
            <th>Property</th>
            <th>Menu</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://xgnhzvjacultlyvioifw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnbmh6dmphY3VsdGx5dmlvaWZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTk1NTMsImV4cCI6MjEwNzM5NTU1M30.jddLUkGKhXXEqjeUsZAONYPsEBYsY6nMqgPpNKnWcEI';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
    else checkUser();
  }

  async function handleLogout() {
    await sb.auth.signOut();
    checkUser();
  }

  async function checkUser() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadBookings();
    } else {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboardSection').style.display = 'none';
    }
  }

  async function createBooking() {
    const truckName = document.getElementById('truckName').value;
    const propertyName = document.getElementById('propertyName').value;
    const visitDate = document.getElementById('visitDate').value;
    const timeSlot = document.getElementById('timeSlot').value;
    const fileInput = document.getElementById('menuFile');

    let menuUrl = '';

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const filePath = `${Date.now()}_${file.name}`;
      const { error: uploadErr } = await sb.storage.from('menus').upload(filePath, file);
      if (uploadErr) return alert('Upload Error: ' + uploadErr.message);
      
      const { data } = sb.storage.from('menus').getPublicUrl(filePath);
      menuUrl = data.publicUrl;
    }

    const { error } = await sb.from('bookings').insert([{
      truck_name: truckName,
      property_name: propertyName,
      visit_date: visitDate,
      time_slot: timeSlot,
      menu_url: menuUrl
    }]);

    if (error) alert('Database Error: ' + error.message);
    else {
      alert('Booking saved!');
      loadBookings();
    }
  }

  async function loadBookings() {
    const { data, error } = await sb.from('bookings').select('*').order('visit_date', { ascending: true });
    if (error) return;
    const tbody = document.getElementById('bookingsTable');
    tbody.innerHTML = data.map(b => `
      <tr>
        <td>${b.visit_date}</td>
        <td>${b.truck_name}</td>
        <td>${b.property_name}</td>
        <td>${b.menu_url ? `<a href="${b.menu_url}" target="_blank">View</a>` : 'None'}</td>
        <td><button class="danger-btn" onclick="deleteBooking(${b.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  async function deleteBooking(id) {
    if (!confirm('Are you sure?')) return;
    await sb.from('bookings').delete().eq('id', id);
    loadBookings();
  }

  checkUser();
</script>
</body>
</html>
